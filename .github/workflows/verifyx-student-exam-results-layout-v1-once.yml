name: VerifyX Student Exam Results Layout V1 Once

on:
  push:
    paths:
      - '.github/workflows/verifyx-student-exam-results-layout-v1-once.yml'
      - 'scripts/oneoff/verifyx-student-exam-results-layout-v1.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply student exam/results layout patch
        run: python scripts/oneoff/verifyx-student-exam-results-layout-v1.py
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/verifyx/student/assignment/[id]/page.js' app/verifyx/student/results/page.js app/verifyx/verifyx-round2.css
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix: compact student exam and results layout"
            git push
          fi
