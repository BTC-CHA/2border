name: Patch CAD Code Dropdown Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cad-code-dropdown-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch question bank
        run: python .github/scripts/patch_cad_code_dropdown_once.py
      - name: Commit patch
        run: |
          git config user.name "BTC-CHA"
          git config user.email "93521971+BTC-CHA@users.noreply.github.com"
          git rm .github/workflows/patch-cad-code-dropdown-once.yml
          git rm .github/scripts/patch_cad_code_dropdown_once.py
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "feat: reuse CAD codes from dropdown"
          git push origin HEAD:main
