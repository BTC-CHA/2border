name: Patch CAD Edit Question Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cad-edit-question-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/patch_cad_edit_question_only.py
      - name: Commit fix and remove one-off files
        shell: bash
        run: |
          git config user.name "BTC-CHA"
          git config user.email "93521971+BTC-CHA@users.noreply.github.com"
          git rm .github/workflows/patch-cad-edit-question-once.yml tools/patch_cad_edit_question_only.py
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "fix: save CAD question edits independently"
          git push origin HEAD:main
