name: VerifyX Device Group Labels Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verifyx-device-group-labels-once.yml'
      - 'scripts/oneoff/verifyx-device-group-labels.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/oneoff/verifyx-device-group-labels.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/results/page.js
          git commit -m "feat: label duplicate device groups"
          git push
