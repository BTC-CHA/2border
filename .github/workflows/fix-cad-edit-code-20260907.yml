name: Fix CAD Edit Code Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff/fix-cad-edit-code-20260907.py'
      - '.github/workflows/fix-cad-edit-code-20260907.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch edit Code behavior
        run: python3 scripts/oneoff/fix-cad-edit-code-20260907.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "BTC-CHA"
          git config user.email "93521971+BTC-CHA@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git rm scripts/oneoff/fix-cad-edit-code-20260907.py .github/workflows/fix-cad-edit-code-20260907.yml
          git commit -m "fix: allow changing CAD question code group"
          git push origin HEAD:main
