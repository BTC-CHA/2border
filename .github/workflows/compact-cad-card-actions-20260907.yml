name: Compact CAD Card Actions Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff/compact-cad-card-actions-20260907.py'
      - '.github/workflows/compact-cad-card-actions-20260907.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CAD card actions
        run: python3 scripts/oneoff/compact-cad-card-actions-20260907.py
      - name: Commit patch and remove one-off files
        run: |
          git config user.name "BTC-CHA"
          git config user.email "93521971+BTC-CHA@users.noreply.github.com"
          git rm scripts/oneoff/compact-cad-card-actions-20260907.py .github/workflows/compact-cad-card-actions-20260907.yml
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "fix: compact CAD card action buttons"
          git push origin HEAD:main
