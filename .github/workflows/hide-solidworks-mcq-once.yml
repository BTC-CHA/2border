name: Hide SolidWorks MCQ Once

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/oneoff/hide-solidworks-mcq.py'
      - '.github/workflows/hide-solidworks-mcq-once.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/oneoff/hide-solidworks-mcq.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "fix: hide SolidWorks MCQ from teacher bank"
          git push
