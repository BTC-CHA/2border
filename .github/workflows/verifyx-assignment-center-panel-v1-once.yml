name: VerifyX Assignment Center Panel V1 Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff/verifyx-assignment-center-panel-v1.py'
      - '.github/workflows/verifyx-assignment-center-panel-v1-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply center panel patch
        run: python scripts/oneoff/verifyx-assignment-center-panel-v1.py
      - name: Validate UI-only scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "app/verifyx/teacher/teacher-ui.css"
          grep -q 'VERIFYX_ASSIGNMENT_CENTER_PANEL_V1' app/verifyx/teacher/teacher-ui.css
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit UI-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/teacher-ui.css
          git commit -m "style: center VerifyX assignment panel" || exit 0
          git push origin main
