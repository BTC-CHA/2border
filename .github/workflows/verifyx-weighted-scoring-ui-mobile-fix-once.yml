name: VerifyX Weighted Scoring UI Mobile Fix Once

on:
  push:
    paths:
      - '.github/workflows/verifyx-weighted-scoring-ui-mobile-fix-once.yml'
      - 'scripts/oneoff/verifyx-weighted-scoring-ui-mobile-fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoring mobile fix
        run: python scripts/oneoff/verifyx-weighted-scoring-ui-mobile-fix.py
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/page.js
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix: refine weighted scoring form on mobile"
            git push
          fi
