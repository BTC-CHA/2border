name: CrownCAD MCQ Display Codes Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff/cc-mcq-display-codes.py'
      - '.github/workflows/cc-mcq-display-codes-once.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/oneoff/cc-mcq-display-codes.py
      - name: Commit patched UI
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "feat: show structured CrownCAD MCQ codes"
          git push
