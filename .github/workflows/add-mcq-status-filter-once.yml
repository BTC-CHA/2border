name: Add MCQ Status Filter Once

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/oneoff/add-mcq-status-filter.py'
      - '.github/workflows/add-mcq-status-filter-once.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/oneoff/add-mcq-status-filter.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "feat: filter MCQ by active status"
          git push
