name: VerifyX Student Exam Controls Center Once

on:
  push:
    paths:
      - '.github/workflows/verifyx-student-exam-controls-center-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply control centering patch
        run: python scripts/oneoff/verifyx-student-exam-controls-center.py
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/verifyx-round2.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: center student exam controls"
          git push
