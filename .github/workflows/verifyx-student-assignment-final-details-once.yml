name: VerifyX Student Assignment Final Details Once
on:
  push:
    paths:
      - 'scripts/oneoff/verifyx-student-assignment-final-details.py'
      - '.github/workflows/verifyx-student-assignment-final-details-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/oneoff/verifyx-student-assignment-final-details.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/verifyx/student/assignment/[id]/page.js'
          git diff --cached --quiet && exit 0
          git commit -m "feat: show student assignment details after close"
          git push
