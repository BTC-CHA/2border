name: Color MCQ Status Button Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff/color-mcq-status-button.py'
      - '.github/workflows/color-mcq-status-button-once.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/oneoff/color-mcq-status-button.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "fix: color MCQ status buttons by state"
          git push
