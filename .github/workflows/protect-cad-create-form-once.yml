name: Protect CAD Create Form Once

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/oneoff/protect-cad-create-form.py'
      - '.github/workflows/protect-cad-create-form-once.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/oneoff/protect-cad-create-form.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/question-bank/page.js
          git commit -m "fix: protect CAD create form from accidental close"
          git push
