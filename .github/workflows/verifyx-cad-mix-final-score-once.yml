name: VerifyX CAD Mix Final Score Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verifyx-cad-mix-final-score-once.yml'
      - 'scripts/oneoff/verifyx-cad-mix-final-score.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/oneoff/verifyx-cad-mix-final-score.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/verifyx/teacher/page.js app/verifyx/student/assignment/'[id]'/page.js
          git commit -m "fix: align CAD assignment flow and final score"
          git push
